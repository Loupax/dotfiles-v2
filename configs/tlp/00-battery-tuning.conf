# Drop-in for /etc/tlp.d/ (read before /etc/tlp.conf, which must NOT define
# these same keys or it silently wins - see tlp.conf's own precedence notes).

# xHCI controller 0000:05:00.4 (webcam + Bluetooth) crashes ("HC died") if
# any USB device behind it autosuspends. usbcore.autosuspend=-1 already
# forces this at the kernel boot-param level; keep TLP from fighting that.
USB_AUTOSUSPEND=0

# Pin explicitly on both AC and battery so TLP doesn't pick a different
# governor per power source than the schedutil default already in use.
CPU_SCALING_GOVERNOR_ON_AC=schedutil
CPU_SCALING_GOVERNOR_ON_BAT=schedutil
